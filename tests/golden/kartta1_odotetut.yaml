# Testiaineiston v1 odotetut tulokset: tests/golden/kartta1_otos.txt (30 yksikköä).
#
# TILA: VAHVISTAMATON. Kehittäjän luonnos 22.11.2026. Kaavoittajat eivät ole vielä
# annotoineet aineistoa (suunnitelman luku 10.2), joten odotukset ovat kehittäjän tulkintoja
# suunnitelman lukujen 6.10 ja 8 suositusten mukaan. Ne koskevat linjausten oletuksia
# (knowledge/org/tampere/linjaukset.yaml v1, ADR-0010).
#
# Kentät:
#   otsikko, tunnus   yksikön tunniste lähteessä (tunnus null = vain symboli)
#   ryhmatyyppi       kaavakohde | yleismaarays | ei_maarays
#   rakenne           muut kuin sanalliset määräykset: "laji(lisätieto,lisätieto=arvo)", lisätiedot
#                     aakkosjärjestyksessä
#   hyvaksyttavat     muut hyväksyttävät rakenteet (oikeita vastauksia voi olla useita)
#   kirjaintunnus     odotettu tunnus (L-06 alkuperaiset; puuttuva liitteestä 4); null = ei tunnusta
#                     tai ei odotusta
#   sanallinen        onko ryhmässä sanallinen määräys (lähteen teksti)
#   kysymykset        tulkintakysymykset, jotka on tunnistettava (avoimena tai linjauksella ratkaistuna)
#   huomautus         kehittäjän perustelu
#   sanallisen_lajit  odotetut sanallisen määräyksen lajit (pääaiheet; lisätty vaiheessa 2)
#   sanallisen_lajit_muut  myös perustellut lajit (eivät ole virheitä F1-mittarissa)

tila: vahvistamaton
laatija: kehittäjä (luonnos)
paivays: 2026-11-22
