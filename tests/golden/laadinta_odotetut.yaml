  - syote:
      tyyppi: merkinta
      otsikko: Teollisuus- ja varastoalue
      tunnus: T
      teksti: Alueen tehokkuusluku on e=0,5.
    otsikko: Teollisuus- ja varastoalue
    tunnus: T
    ryhmatyyppi: kaavakohde
    rakenne: ["teollisuusalue(paakayttotarkoitus)", "varastoalue(paakayttotarkoitus)", "tehokkuusluku()"]
    kirjaintunnus: T
    sanallinen: true
    sanallisen_lajit: [rakennusoikeus]
    kysymykset: [K11]
