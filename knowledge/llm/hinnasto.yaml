# Kielimallien hinnasto kustannusarviota ja budjettirajaa varten (käsin ylläpidettävä; ADR-0013).
#
# Hinnat ovat dollareita miljoonaa tokenia kohden. Hinnat muuttuvat: tarkista ennen käyttöä
# toimittajan hinnastosta ja päivitä 'tarkistettu'. Arvio on suuntaa antava; toteutunut
# kustannus lasketaan vastausten tokenimääristä samalla hinnastolla.
#
#   syote                 välimuistittamaton syöte
#   tuloste               tuloste (sisältää päättelyn)
#   valimuisti_kirjoitus  välimuistiin kirjoitettu syöte (Claude: noin 1,25 × syöte, 5 min)
#   valimuisti_luku       välimuistista luettu syöte
#   merkkia_per_token     karkea suomenkielisen tekstin merkkimäärä tokenia kohden arviota varten
#                         (kalibroitu vaiheen 0 piikillä: 28 210 tokenia staattista kontekstia)

