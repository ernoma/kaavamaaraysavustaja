#   korjattu      korvaava arvo (null = tyhjennetään)
#   perustelu     miksi korjataan
#   lahde         mihin korjaus perustuu
#   vahvistettava true = asiantuntijan (kaavoittaja / YM) vahvistettava ennen tuotantokäyttöä
#
# Laaturaportti: docs/laaturaportti_liite3.md

