[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kaavamaaraysavustaja"
version = "0.3.2"
description = "Sanallisten kaava- ja yleismääräysten muuntaminen Katja-asetuksen mukaiseen rakenteiseen muotoon (Ryhti-JSON, Arho-kirjasto)"
readme = "README.md"
license = "GPL-2.0-or-later"
requires-python = ">=3.12"
# Ajonaikaiset riippuvuudet pidetään QGISin mukana tulevissa paketeissa (PyYAML).
dependencies = ["PyYAML>=6"]

[project.scripts]
kma = "kaavamaaraysavustaja.cli:main"

[project.optional-dependencies]
# Kielimalliadapterit: valinnaisia, ydin toimii ilman niitä (sääntöpohjainen tila).
llm = ["anthropic>=2.12", "mistralai>=1.0"]
# Kehitys: testit, lint, tietopaketin rakentaja ja PDF-poiminta (openpyxl ja pypdf vain tools/-skripteille).
dev = ["pytest>=8", "ruff>=0.6", "openpyxl>=3.1", "jsonschema>=4.18", "pypdf>=5"]

[tool.setuptools.packages.find]
include = ["kaavamaaraysavustaja*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not live and not qgis'"
markers = [
    "live: vaatii verkon ja API-avaimen (ei ajeta CI:ssä)",
    "qgis: vaatii QGISin Pythonin (KMA_QGIS_PYTHON; ei ajeta CI:ssä)",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["lahtoaineistot", "knowledge"]

[tool.ruff.format]
exclude = ["*.md"]  # dokumenttien koodiesimerkit jätetään sellaisinaan

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "TID"]
ignore = ["E501"]  # rivipituuden hoitaa ruff format

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Arkkitehtuurisääntö A1 tarkistetaan myös testillä tests/unit/test_architecture.py.
"openpyxl".msg = "openpyxl on vain kehitysriippuvuus (tools/)."
"pypdf".msg = "PDF-kirjastot ovat vain kehitystyökaluja (tools/extract_pdf_text.py, ADR-0009)."
"fitz".msg = "PDF-kirjastot ovat vain kehitystyökaluja (ADR-0009); PyMuPDF (AGPL) ei ole GPL-2.0-yhteensopiva."
"pymupdf".msg = "PDF-kirjastot ovat vain kehitystyökaluja (ADR-0009); PyMuPDF (AGPL) ei ole GPL-2.0-yhteensopiva."
"pdfminer".msg = "PDF-kirjastot ovat vain kehitystyökaluja (ADR-0009)."

[tool.ruff.lint.per-file-ignores]
"tools/**" = ["TID251"]
"tests/**" = ["TID251"]
